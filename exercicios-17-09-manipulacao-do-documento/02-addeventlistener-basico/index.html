<body>
  <main class="painel">
    <h1>Primeiros passos com addEventListener</h1>
    <p>addEventListener é o método que faz o JavaScript "escutar" ações do usuário e reagir a elas. É como instalar uma campainha: o botão existe, mas só faz algo quando alguém aperta.</p>

    <button id="btn">Clique aqui</button>
    <p id="mensagem">Nenhum clique ainda.</p>
  </main>
