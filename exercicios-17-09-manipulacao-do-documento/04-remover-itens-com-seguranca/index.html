<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício 4 - Removendo itens com segurança</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="painel">
    <h1>Remover com segurança</h1>
    <p id="status">A lista tem 3 itens. Clique para remover o último.</p>

    <button id="btn-remover-ultimo">Remover último item</button>
    <button id="btn-remover-especifico">Remover item "Feijão" (removeChild)</button>

    <ul id="lista">
      <li class="item" id="item-arroz">Arroz</li>
      <li class="item" id="item-feijao">Feijão</li>
      <li class="item" id="item-macarrao">Macarrão</li>
    </ul>
  </main>
</body>
</html>
