<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio - Catálogo de bicicletas</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="painel catalogo">
    <h1>Catálogo de bicicletas</h1>
    <p id="status">Abra o console para ver o resultado da seleção.</p>

    <!--
      Adaptação do exercício "Bikcraft" do slide 22: uma vitrine de
      produtos onde vamos apenas SELECIONAR e LER dados com console.log,
      sem alterar nada visualmente na página (isso fica para o Encontro 2).
    -->
    <div class="bicicleta">
      <img src="https://via.placeholder.com/160x110?text=Mountain+X1" alt="Mountain Bike X1">
      <h2 class="nome">Mountain Bike X1</h2>
      <span class="preco">R$ 2.499,00</span>
    </div>

    <div class="bicicleta">
      <img src="https://via.placeholder.com/160x110?text=Speed+Pro" alt="Speed Pro">
      <h2 class="nome">Speed Pro</h2>
      <span class="preco">R$ 3.899,00</span>
    </div>

    <div class="bicicleta">
      <img src="https://via.placeholder.com/160x110?text=Urban+Ride" alt="Urban Ride">
      <h2 class="nome">Urban Ride</h2>
      <span class="preco">R$ 1.799,00</span>
    </div>
  </main>
</body>
</html>
